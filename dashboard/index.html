<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incubator fleet</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d1f23; --muted:#6b7280; --ok:#1a7f37; --bad:#b42318; --line:#e5e7eb; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-weight:600; font-size:13px; }
  tr.row { cursor:pointer; } tr.row:hover { background:#f0f2f5; } tr.sel { background:#e8f0fe; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .on { background:var(--ok); } .off { background:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-top:20px; }
  .kv { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; }
  .kv div span { display:block; color:var(--muted); font-size:12px; }
  .kv div b { font-size:20px; font-weight:600; }
  svg { width:100%; height:160px; margin-top:12px; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Incubator fleet</h1>
  <p class="sub">Latest status from the DynamoDB status table through the HTTP API. Refreshes every 15 s. <span id="api"></span></p>
  <table>
    <thead><tr><th>Device</th><th>Chamber</th><th>Target</th><th>Heater</th><th>Door</th><th>Last seen</th></tr></thead>
    <tbody id="devices"><tr><td colspan="6">Loading…</td></tr></tbody>
  </table>
  <section class="card" id="detail" hidden>
    <h2 id="detail-title" style="margin:0 0 12px;font-size:16px"></h2>
    <div class="kv" id="detail-kv"></div>
    <svg id="chart" viewBox="0 0 600 160" preserveAspectRatio="none" aria-label="Last hour of chamber temperature"></svg>
    <p class="sub" id="chart-note"></p>
  </section>
</main>
<script>
(async function () {
  const cfg = await fetch('config.json').then(r => r.json()).catch(() => ({ apiUrl: '' }));
  const api = (cfg.apiUrl || '').replace(/\/$/, '');
  document.getElementById('api').textContent = api ? 'API: ' + api : 'No API URL configured.';
  let selected = null;

  const fmtAge = s => s < 60 ? s + ' s ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago';
  const esc = v => String(v == null ? '—' : v).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  async function loadDevices() {
    const tbody = document.getElementById('devices');
    try {
      const { devices } = await fetch(api + '/devices').then(r => r.json());
      if (!devices.length) { tbody.innerHTML = '<tr><td colspan="6">No devices have reported yet.</td></tr>'; return; }
      tbody.innerHTML = devices.map(d => `
        <tr class="row ${d.device_id === selected ? 'sel' : ''}" data-id="${esc(d.device_id)}">
          <td><span class="dot ${d.online ? 'on' : 'off'}"></span>${esc(d.device_id)}</td>
          <td>${esc(d.temp)} °C · ${esc(d.hum)} %</td>
          <td>${esc(d.targetTemp)} °C</td>
          <td>${d.heater ? 'ON' : 'off'}</td>
          <td>${esc(d.door)}</td>
          <td>${fmtAge(d.age_s)}</td>
        </tr>`).join('');
      tbody.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => { selected = tr.dataset.id; loadDevices(); loadDetail(); });
    } catch (e) { tbody.innerHTML = `<tr><td colspan="6" class="err">Could not reach the API (${esc(e.message)})</td></tr>`; }
  }

  async function loadDetail() {
    if (!selected) return;
    const sec = document.getElementById('detail'); sec.hidden = false;
    const [latest, hist] = await Promise.all([
      fetch(`${api}/devices/${encodeURIComponent(selected)}`).then(r => r.json()),
      fetch(`${api}/devices/${encodeURIComponent(selected)}/history?minutes=60`).then(r => r.json())
    ]);
    document.getElementById('detail-title').textContent = selected + (latest.online ? ' · online' : ' · stale');
    const kv = [['Chamber', latest.temp + ' °C'], ['Humidity', latest.hum + ' %'], ['Outside', (latest.tempOut ?? '—') + ' °C'],
      ['Δ in–out', (latest.delta_in_out ?? '—') + ' °C'], ['Target', latest.targetTemp + ' °C'], ['Latency', latest.latency_s + ' s'],
      ['Cycle day', latest.cycleDay ?? '—'], ['Received', new Date(latest.received_at * 1000).toLocaleString()]];
    document.getElementById('detail-kv').innerHTML = kv.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('');
    drawChart(hist.items || []);
  }

  function drawChart(items) {
    const svg = document.getElementById('chart'); svg.innerHTML = '';
    const note = document.getElementById('chart-note');
    if (items.length < 2) { note.textContent = 'Not enough history in the last hour to draw.'; return; }
    const W = 600, H = 160, pad = 24;
    const ts = items.map(i => i.ts), temps = items.map(i => i.temp), targets = items.map(i => i.targetTemp);
    const t0 = Math.min(...ts), t1 = Math.max(...ts);
    const lo = Math.min(...temps, ...targets) - 0.5, hi = Math.max(...temps, ...targets) + 0.5;
    const x = t => pad + (t - t0) / Math.max(1, t1 - t0) * (W - 2 * pad);
    const y = v => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad);
    const path = (vals) => vals.map((v, i) => (i ? 'L' : 'M') + x(ts[i]).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    // heater-on bands
    let bands = '';
    items.forEach((it, i) => { if (it.heater && i + 1 < items.length) bands += `<rect x="${x(ts[i])}" y="${pad}" width="${Math.max(1, x(ts[i+1]) - x(ts[i]))}" height="${H - 2*pad}" fill="#fde68a" opacity=".6"/>`; });
    svg.innerHTML = bands +
      `<path d="${path(targets)}" stroke="#9ca3af" stroke-dasharray="4 3" fill="none"/>` +
      `<path d="${path(temps)}" stroke="#2563eb" stroke-width="2" fill="none"/>` +
      `<text x="${pad}" y="14" font-size="11" fill="#6b7280">${hi.toFixed(1)} °C</text>` +
      `<text x="${pad}" y="${H - 6}" font-size="11" fill="#6b7280">${lo.toFixed(1)} °C</text>`;
    note.textContent = `${items.length} readings · blue = chamber, dashed = target, yellow = heater on`;
  }

  await loadDevices(); setInterval(() => { loadDevices(); loadDetail(); }, 15000);
})();
</script>
</body>
</html>
